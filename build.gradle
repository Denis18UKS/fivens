buildscript {
    repositories {
        maven {
            url = 'https://maven.fabricmc.net/'
        }

        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10-SNAPSHOT'
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: 'fabric-loom'


// ============================================================
// LOOM / MIXIN
// ============================================================

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "Fifth-Horror-Engine-refmap.json"
    }
}


// ============================================================
// PROJECT
// ============================================================

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


// ============================================================
// REPOSITORIES
// ============================================================

repositories {
    mavenCentral()

    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'

        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
}


// ============================================================
// DEPENDENCIES
// ============================================================

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    // Real VHS media engine. Only the JavaCV/JavaCPP/FFmpeg pieces that Fiven actually uses are bundled.
    // The native classifier intentionally targets the project's current Windows x86_64 client platform.
    implementation('org.bytedeco:javacv:1.5.14') { transitive = false }
    include('org.bytedeco:javacv:1.5.14') { transitive = false }

    implementation('org.bytedeco:javacpp:1.5.14') { transitive = false }
    include('org.bytedeco:javacpp:1.5.14') { transitive = false }
    implementation('org.bytedeco:javacpp:1.5.14:windows-x86_64') { transitive = false }
    include('org.bytedeco:javacpp:1.5.14:windows-x86_64') { transitive = false }

    implementation('org.bytedeco:ffmpeg:8.1.2-1.5.14') { transitive = false }
    include('org.bytedeco:ffmpeg:8.1.2-1.5.14') { transitive = false }
    implementation('org.bytedeco:ffmpeg:8.1.2-1.5.14:windows-x86_64') { transitive = false }
    include('org.bytedeco:ffmpeg:8.1.2-1.5.14:windows-x86_64') { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}


test {
    useJUnitPlatform()
}


// ============================================================
// RESOURCES
// ============================================================

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}


// ============================================================
// JAVA
// ============================================================

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
